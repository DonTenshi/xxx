<!DOCTYPE html>
<html lang = "es">
    <head>
        <meta charset = "UTF-8">
        <meta name = "viewport" content = "width=device-width, initial-scale=1.0">
        <title> Bango</title>
        <style>
            *{
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            
            body {
                font-family: Arial, sans-serif;
                background: linea-gradient(135deg, #1a1a2e, #16213e, #0f3460);
                min-height: 100vh;
                display: flex;
                justify-content: center;
                padding: 20px;
            }

            .player-container {
                background: rgba(255, 255, 255, 0.1);
                backdrop-filter: blur(10px);
                padding: 40px;
                border-radius: 20px;
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
                text-align: center;
                max-width: 400px;
                width: 100%;
                border: 1px solid rgba(255, 255, 255, 0.2);
            }

            h1 {
                color: #fff;
                font-size: 28px;
                margin-bottom: 10px;
            }

            .artist{
                color: #aaa;
                font-size: 16px;
                margin-bottom: 30px;
            }

            audio{
                width: 100%;
                margin: 20px 0;
                border-radius: 10px;
                outline: none;
            }

            audio::-webkit-media-controls-panel {
                background: rgba(255, 255, 255, 0.15);
            }

            .info{
                color: #888;
                font-size: 14px;
                margin-top: 20px;
                border-top: 1px solid rgba(255, 255, 255, 0.1);
                padding-top: 20px;
            }

            .info span{
                color: #4fc3f7;
            }

            @keyframes glow {
                0%{ box-shadow: 0 0 20px rgba(79, 195, 247, 0.2);}
                50% { box-shadow: 0 0 40px rgba(79, 195, 247, 0.4);}
                100% { box-shadow: 0 0 20px rgba(79, 195, 247, 0.2);}
            }

            .player-container{
                animation: glow 3s infinite;
            }
        </style>
    </head>

    <body>
        <div class="player-container">
            <h1> Bango </h1>

            <p class="artista"> Bango </p>

            <audio controls>
                <source src="cancion.mp3" type="audio/mpeg">
                tu navegador no soporta el reproductor de audio
            </audio>

            <div class="info">
                <span> Presiona play </span> para escuchar
            </div>

            <div class="info">
                <br> Adezzz
                <br> <br>
                <span id="contador-visitas"></span> personas han visto esta página
            </div>
        </div>

        <script data-goatcounter="https://xxx.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>

        <script>
            var t = setInterval(function() {
                if (window.goatcounter && window.goatcounter.visit_count) {
                    clearInterval(t);
                    window.goatcounter.visit_count({
                        append: '#contador-visitas',
                        path: 'TOTAL', 
                        type: 'html'
                    });
                }
            }, 100);
        </script>
    </body>

    </html>
